name: macOS · pruebas y compilación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas del núcleo y Release arm64
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Registrar el entorno de herramientas
        run: |
          sw_vers
          swift --version
          xcode-select -p
      - name: Ejecutar pruebas con archivos sintéticos
        run: ./Scripts/test.sh
      - name: Construir y verificar firma ad hoc
        run: ./Scripts/build.sh
